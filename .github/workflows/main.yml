name: CI devops 2025
on:
  # Run every time something is pushed on the following branches
  push:
    branches:
      - main
      - develop
  # Run every time a pull request is opened or updated,
  # so the code is tested before being merged
  pull_request:

jobs:
  test-backend:
    # The virtual machine provided by GitHub
    runs-on: ubuntu-24.04
    steps:
      # Checkout the GitHub code using actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Download JDK 21, needed to compile the application
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          # Cache Maven dependencies between runs to speed up builds
          cache: 'maven'


      # Build the app and run the tests
      - name: Build and test with Maven
        run: mvn clean verify
        # Maven must run from the folder containing pom.xml
        working-directory: ./simple-api

      # Analyze code quality and security with SonarCloud
      # The pipeline fails if the Quality Gate does not pass
      - name: SonarCloud Analysis
        working-directory: ./simple-api
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey=dockertp_tp-devops-correction-docker \
            -Dsonar.organization=dockertp  \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=true

  # Define job to build and publish docker images
  build-and-push-docker-image:
    # Run only when code is compiling and tests are passing
    needs: test-backend
    runs-on: ubuntu-24.04

    # Steps to perform in job
    steps:
      # Each job runs on a fresh machine, so the code must be checked out again
      - name: Checkout code
        uses: actions/checkout@v4

      # Log in to Docker Hub with the credentials stored in the repository secrets.
      # The token is piped through stdin so it never appears in the command line or logs.
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          # Relative path to the place where source code with Dockerfile is located
          context: ./simple-api
          # Note: tags has to be all lower-case
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest
          # Build on feature branches, push only on main branch
          push: ${{ github.ref == 'refs/heads/main' }}

      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-http-server:latest
          push: ${{ github.ref == 'refs/heads/main' }}

  deploy:
    needs: build-and-push-docker-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-galaxy collection install 'community.docker:==3.12.2'

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy with Ansible
        working-directory: ./ansible
        run: |
          ansible-playbook -i inventories/setup.yml docker.yml \
            -e "ansible_ssh_private_key_file=$HOME/.ssh/id_rsa"

